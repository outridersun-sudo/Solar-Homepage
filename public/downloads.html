<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기술자료실 | 천일테크윈</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    body > header,
    body > .page-hero,
    body > footer {
      flex-shrink: 0;
    }

    body > .section {
      flex: 1;
    }

    body > .footer {
      margin-top: 0;
    }

    .download-page button {
      font: inherit;
      cursor: pointer;
    }

    .download-page button:disabled {
      opacity: .45;
      cursor: default;
    }

    .download-page .toolbar {
      flex-wrap: wrap;
    }

    .download-page .search {
      min-width: 200px;
    }

    .download-page .table-wrap {
      overflow-x: auto;
    }

    .download-page table {
      min-width: 800px;
    }

    .download-page td {
      overflow-wrap: anywhere;
    }

    .download-page .file-actions {
      display: flex;
      gap: 8px;
      white-space: nowrap;
    }

    .download-page .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 24px;
    }

    .download-page .secondary {
      background: white;
      border: 1px solid #dce4eb;
      border-radius: 8px;
      padding: 9px 16px;
      color: #334155;
    }

    .download-page #message {
      color: #b54708;
      margin-bottom: 15px;
    }

    .download-page #message:empty {
      display: none;
    }

    .download-page #summary {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .download-page .empty {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }
  </style>
</head>

<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">천일테크윈</a>

    <nav class="nav">
      <a href="index.html">홈</a>
      <a href="company.html">회사소개</a>
      <a href="products.html">제품소개</a>
      <a
        href="downloads.html"
        class="active"
        aria-current="page"
      >기술자료</a>
      <a href="as-service.html">A/S 지원</a>
      <a href="notices.html">공지사항</a>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb">HOME / DOWNLOADS</div>
    <h1>기술자료실</h1>
    <p>제품 카탈로그, 매뉴얼, 인증자료를 다운로드할 수 있습니다.</p>
  </div>
</section>

<main class="section download-page">
  <div class="container">
    <form id="filters" class="toolbar">
      <input
        id="searchInput"
        class="search"
        type="search"
        maxlength="200"
        placeholder="제품명, 자료명 검색"
        aria-label="제품명 또는 자료명"
      >

      <select
        id="categoryFilter"
        class="select"
        aria-label="자료 구분"
      >
        <option value="">전체 자료</option>
        <option>카탈로그</option>
        <option>매뉴얼</option>
        <option>인증서</option>
        <option>기타</option>
      </select>

      <button type="submit" class="secondary">검색</button>
      <button id="reset" type="button" class="secondary">
        전체 보기
      </button>
    </form>

    <p id="summary" aria-live="polite">
      자료를 불러오고 있습니다.
    </p>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>구분</th>
            <th>제품</th>
            <th>자료명</th>
            <th>버전</th>
            <th>등록일</th>
            <th>파일</th>
          </tr>
        </thead>

        <tbody id="rows">
          <tr>
            <td colspan="6" class="empty">
              자료를 불러오고 있습니다.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <nav class="pagination" aria-label="자료 목록 페이지">
      <button id="prev" type="button" class="secondary" disabled>
        이전
      </button>

      <span id="page">1 페이지</span>

      <button id="next" type="button" class="secondary" disabled>
        다음
      </button>
    </nav>
  </div>
</main>

<footer class="footer">
  <div class="container footer-grid">
    <div>
      <strong>천일테크윈</strong>
      <p>태양광 인버터 · 통신 RTU · 발전소 모니터링 솔루션</p>
    </div>

    <div>
      <p>인천광역시 제물포구 화도진로 127</p>
      <p>TEL 032-764-0671~3 · E-mail info@example.com</p>
      <p>© 2026 천일테크윈. All Rights Reserved.</p>
    </div>
  </div>
</footer>

<script src="js/downloads.js"></script>
</body>
</html>
