<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공지사항 | 천일테크윈</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .notice-board {
      padding-top: 48px;
    }

    .notice-board button {
      font: inherit;
      cursor: pointer;
    }

    .notice-board button:disabled {
      opacity: .45;
      cursor: default;
    }

    .notice-board button:focus-visible {
      outline: 3px solid #69b8ed;
      outline-offset: 4px;
    }

    .notice-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .notice-toolbar h2 {
      color: #0f2740;
      font-size: 24px;
    }

    .notice-summary {
      color: #6b7280;
      font-size: 13px;
      margin-top: 4px;
    }

    .notice-secondary {
      border: 1px solid #dce4eb;
      border-radius: 8px;
      background: white;
      color: #334155;
      padding: 9px 16px;
    }

    .notice-board .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
    }

    .notice-board .notice-table {
      width: 100%;
      min-width: 620px;
      table-layout: fixed;
    }

    .notice-table .col-number {
      width: 86px;
    }

    .notice-table .col-date {
      width: 145px;
    }

    .notice-table .col-action {
      width: 105px;
    }

    .notice-table th {
      padding: 15px 18px;
      background: #f0f5f9;
      color: #0f2740;
      font-weight: 700;
    }

    .notice-table td {
      padding: 18px;
      color: #0f2740;
      vertical-align: middle;
    }

    .notice-table tbody tr:hover {
      background: #f8fbfe;
    }

    .notice-number {
      color: #718096 !important;
    }

    .notice-date {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .notice-title-button {
      display: block;
      width: 100%;
      background: none;
      border: 0;
      padding: 0;
      text-align: left;
      color: #0f2740;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .notice-title-button:hover {
      color: #1367a8;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .notice-view {
      background: #1367a8;
      color: white;
      border: 0;
      border-radius: 7px;
      padding: 8px 14px;
      font-size: 13px !important;
      font-weight: 700 !important;
    }

    .notice-view:hover {
      background: #0e5287;
    }

    .notice-empty {
      text-align: center;
      padding: 48px 18px !important;
      color: #6b7280 !important;
    }

    .notice-pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
      color: #475569;
      font-size: 14px;
    }

    .notice-message {
      color: #b54708;
      margin-bottom: 16px;
    }

    .notice-message:empty {
      display: none;
    }

    .notice-detail {
      margin-top: 32px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      scroll-margin-top: 100px;
    }

    .notice-detail-header {
      background: #f0f5f9;
      padding: 24px;
      border-bottom: 1px solid #e5e7eb;
    }

    .notice-detail-label {
      color: #1367a8;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .notice-detail h2 {
      color: #0f2740;
      font-size: 24px;
      margin: 8px 0;
      overflow-wrap: anywhere;
    }

    .notice-detail-date {
      color: #6b7280;
      font-size: 13px;
    }

    .notice-content {
      padding: 28px 24px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.9;
      min-height: 140px;
    }

    .notice-detail-footer {
      padding: 0 24px 24px;
      text-align: right;
    }

    .notice-board [hidden] {
      display: none !important;
    }

    @media (max-width: 620px) {
      .notice-board {
        padding-top: 30px;
      }

      .notice-toolbar h2 {
        font-size: 21px;
      }

      .notice-detail-header,
      .notice-content {
        padding: 20px;
      }

      .notice-detail h2 {
        font-size: 21px;
      }
    }

    /* 페이지 높이를 화면 높이 이상으로 유지 */
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* 헤더·상단 배너·푸터의 높이 유지 */
    body > header,
    body > .page-hero,
    body > footer {
      flex-shrink: 0;
    }

    /* 남은 공간을 본문이 채워 푸터를 아래로 배치 */
    main.notice-board {
      flex: 1;
    }

    body > .footer {
      margin-top: 0;
    }

  </style>
</head>

<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">천일테크윈</a>

    <nav class="nav" aria-label="주 메뉴">
      <a href="index.html">홈</a>
      <a href="company.html">회사소개</a>
      <a href="products.html">제품소개</a>
      <a href="downloads.html">기술자료</a>
      <a href="as-service.html">A/S 지원</a>
      <a
        href="notices.html"
        class="active"
        aria-current="page"
      >공지사항</a>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb">HOME / NOTICE</div>
    <h1>공지사항</h1>
    <p>천일테크윈의 주요 소식과 안내를 확인하세요.</p>
  </div>
</section>

<main class="section notice-board">
  <div class="container">
    <div class="notice-toolbar">
      <div>
        <h2>공지 목록</h2>
        <p class="notice-summary" id="summary">
          공지를 불러오고 있습니다.
        </p>
      </div>

      <button
        type="button"
        id="reload"
        class="notice-secondary"
      >새로고침</button>
    </div>

    <p
      id="message"
      class="notice-message"
      role="status"
      aria-live="polite"
    ></p>

    <div
      class="table-wrap"
      id="table-region"
      aria-busy="true"
    >
      <table
        class="notice-table"
        aria-label="공개 공지사항 목록"
      >
        <colgroup>
          <col class="col-number">
          <col>
          <col class="col-date">
          <col class="col-action">
        </colgroup>

        <thead>
          <tr>
            <th scope="col">번호</th>
            <th scope="col">공지 제목</th>
            <th scope="col">등록일</th>
            <th scope="col">상세</th>
          </tr>
        </thead>

        <tbody id="list">
          <tr>
            <td colspan="4" class="notice-empty">
              공지를 불러오고 있습니다.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <nav
      class="notice-pagination"
      aria-label="공지 목록 페이지"
    >
      <button
        id="prev"
        type="button"
        class="notice-secondary"
        disabled
      >이전</button>

      <span id="page" aria-live="polite">1 페이지</span>

      <button
        id="next"
        type="button"
        class="notice-secondary"
        disabled
      >다음</button>
    </nav>

    <article
      id="detail"
      class="notice-detail"
      hidden
      aria-labelledby="title"
    >
      <div class="notice-detail-header">
        <div class="notice-detail-label">NOTICE</div>
        <h2 id="title" tabindex="-1"></h2>
        <p id="date" class="notice-detail-date"></p>
      </div>

      <div id="content" class="notice-content"></div>

      <div class="notice-detail-footer">
        <button
          id="close-detail"
          type="button"
          class="notice-secondary"
        >목록으로</button>
      </div>
    </article>
  </div>
</main>

<footer class="footer">
  <div class="container footer-grid">
    <div>
      <strong>천일테크윈</strong>
      <p>태양광 인버터 · 통신 RTU · 발전소 모니터링 솔루션</p>
    </div>

    <div>
      <p>인천광역시 제물포구 화도진로 127</p>
      <p>TEL 032-764-0671~3 · E-mail info@example.com</p>
      <p>© 2026 천일테크윈. All Rights Reserved.</p>
    </div>
  </div>
</footer>

<script src="js/notices.js"></script>
</body>
</html>
